name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PARAMETER_PREFIX: ${{ vars.PARAMETER_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "25"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Publish the jar and restart the instance
        run: |
          set -euo pipefail
          if [ -z "${AWS_REGION}" ]; then
            echo "Set the GitHub variable AWS_REGION." >&2
            exit 1
          fi
          if [ -z "${PARAMETER_PREFIX}" ]; then
            PARAMETER_PREFIX=/statements/prod
          fi
          chmod +x ./gradlew
          ./gradlew bootJar --no-daemon
          jar=$(ls build/libs/*.jar | grep -v -- '-plain.jar' | head -n 1)
          bucket=$(aws ssm get-parameter --name "${PARAMETER_PREFIX}/s3-bucket" --query Parameter.Value --output text)
          instance=$(aws ssm get-parameter --name "${PARAMETER_PREFIX}/instance-id" --query Parameter.Value --output text)
          aws s3 cp "$jar" "s3://${bucket}/deploy/app.jar"
          command_id=$(aws ssm send-command \
            --instance-ids "$instance" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 600 \
            --parameters commands="bash /opt/statement-delivery/remote-deploy.sh" \
            --query Command.CommandId --output text)
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance" \
              --query Status --output text || true)
            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$instance" \
                  --query StandardOutputContent --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$instance" \
                  --query StandardErrorContent --output text
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Deploy command ${command_id} did not finish." >&2
          exit 1
