<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title th:text="|${title ?: 'Something went wrong'} - Statement delivery|">Something went wrong - Statement delivery</title>
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('theme');
                if (!theme) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.dataset.theme = theme;
            } catch (e) { document.documentElement.dataset.theme = 'light'; }
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth">
<main class="signin frame">
    <div class="signin__bar" th:text="${status} ?: 'Error'">Error</div>
    <div class="signin__body">
        <img class="logo" th:src="@{/img/capitec-logo.png}" alt="Capitec">
        <h1 th:text="${title} ?: 'Something went wrong'">Something went wrong</h1>
        <p class="signin__text" th:text="${errorMessage} ?: 'Something went wrong on our side. Please try again.'">Message</p>
        <a class="btn btn--solid" th:href="@{/accounts}">Back to accounts</a>
    </div>
    <div class="signin__bar signin__bar--foot">Statement delivery</div>
</main>
</body>
</html>
