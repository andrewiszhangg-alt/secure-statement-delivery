<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Short id for the header and account menu. The full value stays in the table. -->
<span class="ref" th:fragment="ref(id)" th:title="${id}"
      th:text="${#strings.substring(id.toString(), 0, 8)}">7a02dfaf</span>

<!-- Full id in a table cell. One click copies it. -->
<button type="button" class="id-cell" th:fragment="idCell(id)"
        th:attr="data-copy=${id}"
        th:aria-label="|Copy ${id}|"
        th:text="${id}">7a02dfaf-e88a-4655-91c3-6c0b5a1d2e44</button>
</body>
</html>
