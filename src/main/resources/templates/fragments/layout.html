<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content, active)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title th:replace="${title}">Statement delivery</title>
    <!-- Applies the saved theme before first paint to avoid a flash. -->
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('theme');
                if (!theme) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.dataset.theme = theme;
            } catch (e) { document.documentElement.dataset.theme = 'light'; }
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body th:attr="data-page=${active}">
<div class="app">

    <header>
        <div class="topbar frame">
            <a class="brand" th:href="@{/accounts}" aria-label="Statement Delivery home">
                <img class="logo" th:src="@{/img/capitec-logo.png}" alt="Capitec">
                <span class="brand__name">Statement<span>Delivery</span></span>
            </a>

            <!-- Shown on the statements page so the user can switch accounts without the old Statements tab. -->
            <div class="picker" id="picker" th:if="${currentAccount != null}">
                <button type="button" class="picker__btn" aria-haspopup="true" aria-expanded="false">
                    <span class="picker__label">
                        <th:block th:if="${currentAccount != null}">
                            <span th:text="${currentAccount.accountType.label}">Account</span>
                            <span th:replace="~{fragments/macros :: ref(${currentAccount.id})}"></span>
                        </th:block>
                        <th:block th:if="${currentAccount == null}"
                                  th:text="${accounts == null} ? 'Accounts' : (${accounts.empty} ? 'No accounts' : 'Select account')">Select account</th:block>
                    </span>
                    <span aria-hidden="true">&#9662;</span>
                </button>
                <div class="scrim" hidden></div>
                <div class="menu" hidden>
                    <div class="menu__title">Your accounts</div>
                    <a class="menu__item" th:each="a : ${accounts}"
                       th:href="@{/accounts/{id}/statements(id=${a.id})}"
                       th:attr="aria-current=${currentAccount != null and a.id == currentAccount.id}">
                        <span class="badge" th:text="${#strings.substring(a.accountType.label, 0, 1)}">S</span>
                        <span class="menu__text">
                            <b th:text="${a.accountType.label}">Savings</b>
                            <span th:replace="~{fragments/macros :: ref(${a.id})}"></span>
                        </span>
                        <span class="menu__check" th:if="${currentAccount != null and a.id == currentAccount.id}">&#10003;</span>
                    </a>
                    <button type="button" class="menu__item menu__item--create"
                            data-account-dialog data-mode="create">
                        <span class="badge" aria-hidden="true">+</span> Create account
                    </button>
                </div>
            </div>

            <div class="tools">
                <button type="button" class="icon-btn" id="theme-toggle" aria-label="Toggle light and dark theme">
                    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </button>
                <!-- POST with CSRF token; only shown on signed-in pages (they always have accounts). -->
                <form th:if="${accounts != null}" method="post" th:action="@{/logout}">
                    <button type="submit" class="icon-btn" aria-label="Sign out" title="Sign out">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                    </button>
                </form>
            </div>
        </div>
    </header>

    <th:block th:replace="${content}"></th:block>

    <footer class="footer" th:if="${isAdmin}">
        <a th:href="@{/admin}">Admin</a>
    </footer>
</div>

<dialog class="sheet" id="account-dialog" aria-labelledby="account-dialog-title">
    <form method="post" th:action="@{/accounts}">
        <div class="sheet__title" id="account-dialog-title">New account</div>
        <input type="hidden" name="from" value="accounts">
        <div class="field">
            <label for="accountTypeId">Account type</label>
            <select id="accountTypeId" name="accountTypeId" required>
                <option value="" disabled selected>Select a type</option>
                <option th:each="t : ${accountTypes}" th:value="${t.id}" th:text="${t.label}">Savings</option>
            </select>
        </div>
        <div class="sheet__actions">
            <button type="button" class="btn" data-close>Cancel</button>
            <button type="submit" class="btn btn--solid">Save</button>
        </div>
    </form>
</dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="flash" hidden th:data-message="${message}" th:data-error="${error}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
