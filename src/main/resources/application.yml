spring:
  application:
    name: secure-statement-delivery
  config:
    # Git-ignored local overrides (DB and AWS credentials); absent on servers, which use env vars.
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:statements}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: 8080
  error:
    whitelabel:
      enabled: false
    include-exception: false
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # Set to true behind HTTPS (deployment); false keeps http://localhost sign-in working.
        secure: ${SESSION_COOKIE_SECURE:false}

springdoc:
  api-docs:
    enabled: false

scalar:
  enabled: false

app:
  security:
    dev-token:
      enabled: false
  cognito:
    # Placeholders: replace with your user pool values (env vars or application-local.yml).
    issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.REGION.amazonaws.com/USER_POOL_ID}
    domain: ${COGNITO_DOMAIN:https://YOUR_PREFIX.auth.REGION.amazoncognito.com}
    web-client-id: ${COGNITO_WEB_CLIENT_ID:REPLACE_ME}
    web-client-secret: ${COGNITO_WEB_CLIENT_SECRET:REPLACE_ME}
    api-client-ids: ${COGNITO_API_CLIENT_IDS:REPLACE_ME}
    # Add profile (and enable it on the app client) to receive given_name and family_name.
    scopes: ${COGNITO_SCOPES:openid,email}
    logout-redirect-uri: ${COGNITO_LOGOUT_REDIRECT_URI:http://localhost:8080/}
  aws:
    region: ${AWS_REGION:eu-central-1}
    s3:
      presign-expiration-minutes: 15
      presign-cache-buffer-minutes: 2
  statement:
    page-size: ${STATEMENT_PAGE_SIZE:5}
    media-context: ${STATEMENT_MEDIA_CONTEXT:account-statements}
  media:
    allowed-content-types:
      - application/pdf
    allowed-extensions:
      - pdf

  storage:
    cleanup-delay-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

logging:
  level:
    com.chitsa: INFO
